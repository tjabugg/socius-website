<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00002e" />
    <meta name="msapplication-TileColor" content="#00002e" />

    <!--
      Fallback title and metadata. Per-page <title>, description, canonical,
      Open Graph and Twitter tags are set by the <Seo> component (react-helmet)
      and baked into each route's HTML at build time by react-snap.
    -->
    <title>socius labs — Open-source AI models for social scientists</title>

    <!-- Icons & web app manifest -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#51da4c" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Libre+Baskerville&family=Montagu+Slab:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="/fonts/GeneralSans-Regular.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeneralSans-Medium.otf"
      as="font"
      type="font/otf"
      crossorigin
    />

    <!-- Structured data: tells search engines who socius labs is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "socius labs",
        "url": "https://socius.org",
        "logo": "https://socius.org/android-chrome-256x256.png",
        "description": "socius labs is experimenting at the intersection between every field that ever studied “thinking” and every machine that’s trying to “think”.",
        "email": "nick.sh.oh@socius.org",
        "sameAs": [
          "https://github.com/socius-org",
          "https://www.linkedin.com/company/socius-labs/",
          "https://www.instagram.com/socius.labs/"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "socius labs",
        "url": "https://socius.org"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
